<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Who Owns the Skin? — DRAFT</title>

    <style>
        * { box-sizing: border-box; margin: 0; }

        html { scroll-behavior: smooth; }

        body { background: #000; color: #f5f5f5; font-family: Arial, Helvetica, sans-serif; }

        h1, h2, h3 { font-family: Georgia, serif; font-weight: normal; }

        .note { font-family: "Courier New", monospace; font-size: 11px; color: #888; }

        section, footer { padding: 80px 8%; border-top: 1px dashed #555; }

        /* HERO */
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

        .hero h1 { font-size: clamp(60px, 12vw, 150px); line-height: 0.9; margin: 20px 0 40px; }

        /* SECTIONS */
        h2 { font-size: 38px; margin: 20px 0 30px; }

        /* PERSPECTIVES */
        .perspective-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }

        .perspective-buttons button {
            background: transparent;
            border: 1px dashed #f5f5f5;
            padding: 15px 25px;
            color: #f5f5f5;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .perspective-buttons button:hover,
        .perspective-buttons button.is-active { background: #f5f5f5; color: #000; border-style: solid; }

        .result { max-width: 700px; padding: 25px; border: 1px dashed #888; }

        .result h3 { font-size: 44px; margin: 15px 0; }

        .result p { line-height: 1.6; color: #ccc; }

        /* FOOTER */
        footer p { font-family: Georgia, serif; font-size: 32px; line-height: 1.3; }

        @media (max-width: 700px) {
            .result h3 { font-size: 36px; }
        }
    </style>
</head>

<body>
    <section class="hero">
        <p class="note">DRAFT v0.1</p>
        <h1>WHO OWNS<br>THE SKIN?</h1>
        <p>When an animal dies, what does its skin become?</p>
    </section>

    <section>
        <p class="note">FOUR PERSPECTIVES</p>
        <h2>What does the skin become?</h2>

        <div class="perspective-buttons">
            <button type="button" data-view="science">SCIENCE</button>
            <button type="button" data-view="ethics">ETHICS</button>
            <button type="button" data-view="memory">MEMORY</button>
            <button type="button" data-view="trophy">TROPHY</button>
        </div>

        <div class="result">
            <p class="note">SKIN BECOMES</p>
            <h3 id="result-title">?</h3>
            <p id="result-description">Choose one of the perspectives above.</p>
        </div>
    </section>

    <footer>
        <p>THE MATERIAL DOES NOT CHANGE.<br>THE SYSTEM AROUND IT DOES.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
